name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile firmware (ESP32C3 Dev Module)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc \
            --output-dir ./build/esp32c3-dev \
            firmware

      - name: Compile firmware (XIAO ESP32C3)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32C3:PartitionScheme=min_spiffs \
            --output-dir ./build/xiao-esp32c3 \
            firmware

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build/esp32c3-dev/firmware.ino.bin
            build/xiao-esp32c3/firmware.ino.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: ./release

      - name: Rename binaries for clarity
        run: |
          mv ./release/build/esp32c3-dev/firmware.ino.bin ./release/firmware-esp32c3-dev-module.bin
          mv ./release/build/xiao-esp32c3/firmware.ino.bin ./release/firmware-xiao-esp32c3.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/firmware-esp32c3-dev-module.bin
            release/firmware-xiao-esp32c3.bin
          body: |
            ## AI Network Badge Firmware ${{ github.ref_name }}

            **Download the `.bin` for your board** and upload it via the web OTA page (`/update`).

            | File | Board | Notes |
            |------|-------|-------|
            | `firmware-esp32c3-dev-module.bin` | ESP32-C3 SuperMini / generic C3 dev boards | USB CDC On Boot enabled |
            | `firmware-xiao-esp32c3.bin` | Seeed XIAO ESP32-C3 | CDC handled by board profile |

            ### How to update over Wi-Fi
            1. Connect to the badge Wi-Fi (`AI-BADGE-XXXX`)
            2. Go to `http://192.168.4.1/update?key=<your-key>`
            3. Upload the `.bin` file for your board
            4. Badge reboots with new firmware
