name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc \
            --output-dir ./build \
            firmware

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: build/firmware.ino.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/firmware.ino.bin
          body: |
            ## AI Network Badge Firmware ${{ github.ref_name }}

            **Download `firmware.ino.bin`** below and upload it to your badge via the web OTA page (`/update`).

            ### Build info
            - Board: ESP32C3 Dev Module
            - Partition Scheme: Minimal SPIFFS (1.9MB APP with OTA)
            - USB CDC On Boot: Enabled

            ### How to update
            1. Connect to the badge Wi-Fi (`AI-BADGE-XXXX`)
            2. Go to `http://192.168.4.1/update?key=<your-key>`
            3. Upload the `.bin` file
            4. Badge reboots with new firmware
